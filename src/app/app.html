<div class="tabs">
  <button [class.active]="tab() === 'lens'" (click)="showLens()">Lens</button>

  <button [class.active]="tab() === 'debug'" (click)="showDebug()">Debug</button>
</div>

<div [hidden]="tab() !== 'lens'">
  <app-lens />
</div>

<div [hidden]="tab() !== 'debug'">
  <app-debug />
</div>
